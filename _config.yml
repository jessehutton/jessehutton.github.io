# ---------------------------------------------------------------------------
# Site-wide settings for nrg.wtf
# This file is NOT reloaded by `bundle exec jekyll serve`; restart after edits.
#
# Where to edit things:
#   Social links ............ _data/social.yml
#   Image paths ............. _data/images.yml
#   Setup carousel slides ... _data/setup.yml + _includes/setup/*.html
#   Page sections ........... _includes/sections/*.html
#   <head> / scripts ........ _includes/head.html, _includes/scripts.html
#   Page shell .............. _layouts/base.html
# ---------------------------------------------------------------------------

title: NRG_ | Web Developer | Content Creator | Twitch Streamer
short_name: NRG_
author: Jesse Hutton
email: nrg4everyone@gmail.com
description: Jesse Hutton AKA NRG is a full-time Front End Developer, part-time Twitch streamer and YouTube content creator.
keywords: twitch,streamer,web,developer,frontend,vuejs,angular,angularjs,responsive,html5,css3,jquery,php

# Must be empty for a site served at the domain root. ("/" produces broken
# "//images/..." URLs when used with the relative_url filter.)
baseurl: ""
url: "https://nrg.wtf"

twitter_username: nrg_jesse   # used for the twitter:site meta tag
twitch_channel: nrg_          # channel shown in the Twitch embed

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
